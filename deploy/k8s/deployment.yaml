# CrackFlow Kubernetes Manifests
# Apply: kubectl apply -f deploy/k8s/
---
apiVersion: v1
kind: Namespace
metadata:
  name: crackflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crackflow-config
  namespace: crackflow
data:
  NODE_ENV: "production"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "crackflow"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: crackflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: ghcr.io/crackflow/server:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: crackflow-config
        - secretRef:
            name: crackflow-secrets
        livenessProbe:
          httpGet:
            path: /api/live
            port: 5000
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 5000
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: crackflow
spec:
  selector:
    app: server
  ports:
  - port: 5000
