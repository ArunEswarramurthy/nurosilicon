# ============================================================================
# CRACKFLOW - Docker Compose Staging Configuration
# Usage: docker compose -f docker-compose.staging.yml up -d
# ============================================================================

version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: crackflow-nginx-staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - client
      - server
    networks:
      - crackflow-staging

  client:
    image: ghcr.io/${GITHUB_REPOSITORY}-client:latest
    container_name: crackflow-client-staging
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - crackflow-staging

  server:
    image: ghcr.io/${GITHUB_REPOSITORY}-server:latest
    container_name: crackflow-server-staging
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=staging
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:?Set DB_NAME}
      - DB_USER=${DB_USER:?Set DB_USER}
      - DB_PASS=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - SANDBOX_MODE=judge0
      - JUDGE0_URL=${JUDGE0_URL:?Set JUDGE0_URL to the HTTPS isolated execution service}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crackflow-staging
    volumes:
      - staging-uploads:/app/uploads

  mysql:
    image: mysql:8.0
    container_name: crackflow-mysql-staging
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:?Set DB_NAME}
      - MYSQL_USER=${DB_USER:?Set DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - staging-mysql:/var/lib/mysql
    networks:
      - crackflow-staging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crackflow-redis-staging
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - staging-redis:/data
    networks:
      - crackflow-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  crackflow-staging:
    driver: bridge

volumes:
  staging-mysql:
  staging-redis:
  staging-uploads:
